# Two-mosquito-species malaria: An. funestus + An. arabiensis in 10k human population.
# Three scenarios compare co-endemic baseline, funestus-dominant conditions,
# and partial ITN coverage (50% reduction in mosquito→human transmission).

[config]
model = "ocaml/golden/malaria_two_species.camdl"
params = "ocaml/golden/malaria_two_species.params.toml"
backend = "gillespie"

[config.seeds]
n = 20

[[scenario]]
# Both species contribute roughly equally; baseline endemic state. The
# model's `baseline` preset (labelled "baseline (co-endemic)") is the
# source of truth — reference it by name, not an empty patch.
name = "baseline"

[[scenario]]
# An. funestus dominant: higher recruitment and biting, arabiensis
# suppressed. A model preset — reference by name (preset is the source
# of truth; it already sets these biting/recruitment params).
name = "funestus_dominant"

[[scenario]]
# 50% ITN coverage: halve mosquito→human biting rates for both species.
name = "itn_50pct"
params = { beta_BH = 0.15, beta_AH = 0.10 }
