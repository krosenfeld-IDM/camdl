name: Docs

# Gates the documented CAMDL code blocks against the real compiler.
#
# ci.yml carries `paths-ignore: docs/**`, so it never fires on doc-only PRs —
# exactly the changes that can rot a documented example. This workflow covers
# that gap: it triggers on changes to the spec, builds only camdlc (OCaml, a
# ~1s build), and runs `camdlc doctest --gate`.
#
# The complementary direction — a *code* change (grammar churn) that breaks a
# documented model — is already caught by ci.yml, whose `make test` runs the
# same `test-docs` gate plus the doctest classifier self-test (dune runtest).

on:
  push:
    branches: [main]
    paths:
      - "docs/camdl-language-spec.md"
      - "docs/intro.md"
      - "docs/user-features.md"
      - "docs/dsl-cheatsheet.md"
      - "docs/dates.md"
      - "docs/camdl-run-spec.md"
      - "docs/workflow.md"
      - "docs/inference.md"
      - "docs/debugging.md"
      - "scripts/check_cli_docs.sh"
      - "rust/crates/cli/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/camdl-language-spec.md"
      - "docs/intro.md"
      - "docs/user-features.md"
      - "docs/dsl-cheatsheet.md"
      - "docs/dates.md"
      - "docs/camdl-run-spec.md"
      - "docs/workflow.md"
      - "docs/inference.md"
      - "docs/debugging.md"
      - "scripts/check_cli_docs.sh"
      - "rust/crates/cli/**"
      - ".github/workflows/docs.yml"

jobs:
  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          cd ocaml
          opam install . --deps-only --yes

      - name: Doctest the language spec
        run: opam exec -- make test-docs

  # CLI command-surface drift gate. Builds the Rust `camdl` binary and asks its
  # hidden parse-only mode (`camdl __check-args`) whether every documented
  # `camdl …` invocation in CLI_DOCS references a real subcommand/flag. The
  # script's `--selftest` runs first as the non-vacuous guard (it must catch
  # synthetic drift), then the docs are gated. No OCaml/camdlc needed: the
  # parse-only check never delegates to the compiler. Cost note: this builds
  # the release `camdl` binary (the toolchain action caches the Cargo registry
  # + target dir, matching ci.yml's Rust setup).
  cli-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # build-rust is a prereq of test-cli-docs (make builds once); the gate
      # then runs the non-vacuous --selftest and the CLI_DOCS surface check.
      - name: Gate documented CLI commands
        run: make test-cli-docs
