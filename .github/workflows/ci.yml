name: CI

# Backend gate: builds the OCaml compiler (camdlc), runs the Rust workspace
# tests EXCEPT the sim crate (which has its own Inference workflow), clippy, the
# golden-file determinism check, and the cross-language integration suite. The
# OCaml compiler's own unit tests run in the Compiler workflow; the simulation
# engine + inference suite runs in the Inference workflow. Together with those,
# this is the same surface `make test` runs locally.
#
# Linux-only: macOS/Windows runners bill 10×/2× and the code is platform-
# invariant. Doc-only and fixture-only changes skip this workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          cd ocaml
          opam install . --deps-only --with-test --yes

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Clippy
        run: cd rust && cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # make test-rust builds camdlc + the release binaries, symlinks camdlc onto
      # PATH (so spawned `camdl` finds it), and runs the workspace (except sim)
      # via `cargo nextest run` plus `cargo test --doc` (nextest does not run
      # doctests). Same surface as before, parallelized.
      - name: Rust tests (workspace except sim)
        run: opam exec -- make test-rust

      - name: Golden files unchanged
        # `make update-golden` regenerates ALL golden corpora in place
        # (ocaml/corner/regression/reactive); the diff must cover every path it
        # writes, else compile-drift in the reactive (tests/fixtures/reactive/ir)
        # or regression (tests/fixtures/regression/ir) goldens slips through —
        # those live OUTSIDE ir/golden|ocaml/golden. This is the CI equivalent of
        # `make check-reactive-golden`, which the local full gate also runs.
        run: |
          opam exec -- make update-golden
          git diff --exit-code ir/golden/ ocaml/golden/ \
            tests/fixtures/reactive/ir/ tests/fixtures/regression/ir/

      - name: Integration tests
        run: opam exec -- make test-integration
